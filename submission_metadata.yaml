ai_usage_summary: |
  Used Claude (Claude Code) for architecture discussion, HOQ weight derivation,
  and iterative code review across 7 commits. All engineering decisions, signal
  selection, weight tuning, and candidate inspection were done by the participant.
  No candidate data was fed to any hosted LLM during ranking — the ranking step
  is fully offline, CPU-only, and makes zero external API calls.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Transparent hybrid ranker — no labels, no training, fully interpretable.
  The JD is encoded as explicit weighted requirements in jd.py (skill groups,
  must-have coverage weights, eval-framework terms). Final score = additive
  blend × multiplicative gates × behavioral multiplier.

  Additive blend (weights sum to 1.0): title fit (0.22), trust-weighted skill
  relevance (0.38), TF-IDF semantic similarity (0.14), ML-relevant YoE (0.10),
  location (0.08), eval-text evidence (0.08).

  Trust-weighted skills discount bare keyword claims by duration_months,
  endorsements, and skill_assessment_scores — defeating stuffers. Cross-group
  redundancy discount prevents double-counting correlated skills (e.g.
  retrieval + vector-DB). Eval-text evidence scans prose for NDCG/MRR/A-B
  terms — a rare signal that proxy-tests real evaluation depth.

  Multiplicative gates: ML YoE <3y (×0.25), <4y (×0.60), 4-5y (×0.95);
  core coverage ≤1/4 must-haves (×0.70); consulting-only career (×0.45);
  junior title (×0.80); self-admission of weakness in summary (×0.85);
  notice period (×0.65–1.00); behavioral composite (×0.40–1.00 capped at
  1.0 for coverage ≤2). Honeypot sink pushes impossible profiles to ×0.03.
  Runtime: ~90s on CPU for 100K candidates.

